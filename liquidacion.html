<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquidación</title>
<style>
:root { --blue:#003b8e; --accent:#0057d9; --gray:#f0f2f7; --text:#1a1a2e; --muted:#6b7280; --border:#e2e6f0; --danger:#ef4444; --success:#16a34a; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,sans-serif; background:var(--gray); color:var(--text); min-height:100vh; }
header { background:var(--blue); color:white; padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
header h1 { flex:1; font-size:1.05rem; font-weight:600; }
.nav-btn { color:white; font-size:1.1rem; text-decoration:none; padding:6px 10px; background:rgba(255,255,255,0.2); border-radius:8px; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.cfg-header-btn { background:rgba(255,255,255,0.2); border:none; color:white; font-size:1.1rem; cursor:pointer; padding:6px 10px; border-radius:8px; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.respaldo-banner { display:flex; background:#fff8e1; border:1px solid #ffc107; border-radius:8px; padding:10px 14px; margin:12px 16px 0; font-size:0.85rem; color:#5d4037; cursor:pointer; touch-action:manipulation; align-items:center; justify-content:space-between; gap:8px; }
#config-screen { display:none; position:fixed; inset:0; background:var(--gray); z-index:200; overflow-y:auto; padding:24px 16px; }
#config-screen.visible { display:block; }
#config-screen h2 { font-size:1.1rem; font-weight:700; margin-bottom:4px; }
#config-screen .subtitulo { font-size:0.85rem; color:var(--muted); margin-bottom:20px; }
.cfg-card { background:white; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,0.07); margin-bottom:16px; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:0.75rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px; }
.form-group input, .form-group textarea, .form-group select { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:7px; font-size:0.95rem; font-family:inherit; color:var(--text); background:white; }
.form-group textarea { resize:vertical; min-height:70px; }
.color-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.color-row input[type="color"] { height:44px; padding:4px 6px; cursor:pointer; }
.btn-cfg { width:100%; padding:13px; background:var(--accent); color:white; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:8px; touch-action:manipulation; }
.btn-volver { width:100%; padding:13px; background:none; border:1.5px solid var(--border); border-radius:8px; font-size:1rem; color:var(--muted); cursor:pointer; margin-top:8px; touch-action:manipulation; }
.contenido { padding:16px; max-width:680px; margin:0 auto; }
.mes-selector { background:#fff; border-radius:14px; padding:14px 16px; box-shadow:0 1px 6px rgba(0,0,0,.07); margin-bottom:16px; display:flex; align-items:center; gap:10px; }
.mes-selector label { font-size:0.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; white-space:nowrap; }
.mes-selector select { flex:1; padding:9px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:0.95rem; }
.btn-ver { padding:9px 16px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:0.88rem; font-weight:700; cursor:pointer; touch-action:manipulation; }
.config-comision { background:#fff; border-radius:14px; padding:14px 16px; box-shadow:0 1px 6px rgba(0,0,0,.07); margin-bottom:16px; display:flex; align-items:center; gap:12px; }
.config-comision label { font-size:0.85rem; font-weight:600; color:var(--muted); flex:1; }
.config-comision input { width:80px; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:1rem; font-weight:700; text-align:center; }
.empleado-card { background:#fff; border-radius:14px; padding:18px; box-shadow:0 1px 6px rgba(0,0,0,.07); margin-bottom:14px; }
.empleado-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.empleado-nombre { font-size:1.05rem; font-weight:700; display:flex; align-items:center; gap:8px; }
.empleado-avatar { width:36px; height:36px; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.9rem; flex-shrink:0; }
.badge-turnos { background:#dbeafe; color:var(--blue); border-radius:99px; padding:3px 10px; font-size:0.78rem; font-weight:700; }
.liq-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px; }
.liq-stat { text-align:center; }
.liq-stat .val { font-size:1.1rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--blue); }
.liq-stat.comision .val { color:var(--success); }
.liq-stat .lab { font-size:0.73rem; color:var(--muted); margin-top:2px; }
.detalle-toggle { width:100%; padding:8px; background:var(--gray); border:none; border-radius:8px; font-size:0.82rem; font-weight:600; color:var(--muted); cursor:pointer; text-align:left; touch-action:manipulation; }
.detalle-lista { display:none; margin-top:10px; }
.detalle-lista.open { display:block; }
.detalle-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:0.83rem; }
.detalle-row:last-child { border-bottom:none; }
.total-card { background:var(--blue); border-radius:14px; padding:20px; text-align:center; box-shadow:0 2px 10px rgba(0,59,142,.2); margin-bottom:16px; }
.total-card .titulo { font-size:0.82rem; color:rgba(255,255,255,.7); margin-bottom:6px; }
.total-card .monto { font-size:1.9rem; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }
.empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-size:0.9rem; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; align-items:flex-end; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal { background:white; border-radius:16px 16px 0 0; padding:24px 20px; width:100%; max-width:500px; max-height:80vh; overflow-y:auto; }
.modal h2 { font-size:1.05rem; font-weight:700; margin-bottom:8px; }
.btn { width:100%; padding:13px; background:var(--accent); color:white; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; touch-action:manipulation; margin-top:4px; }
.btn-gray { background:none; border:1.5px solid var(--border); color:var(--muted); }
</style>
</head>
<body ontouchstart="">

<div id="config-screen">
  <div style="font-size:2rem;text-align:center;margin-bottom:8px">⚙️</div>
  <h2>Configuración de GestorBase</h2>
  <p class="subtitulo">Estos datos se aplican a todos los módulos.</p>
  <div class="cfg-card">
    <div class="form-group"><label>Nombre del negocio</label><input type="text" id="cfg-negocio" placeholder="Ej: Peluquería Carla"></div>
    <div class="form-group"><label>URL de tu planilla Google</label><input type="url" id="cfg-url" placeholder="https://script.google.com/..."></div>
    <div class="color-row">
      <div class="form-group"><label>Color principal</label><input type="color" id="cfg-color1" value="#003b8e"></div>
      <div class="form-group"><label>Color acento</label><input type="color" id="cfg-color2" value="#0057d9"></div>
    </div>
    <div class="form-group"><label>Empleados (uno por línea)</label><textarea id="cfg-empleados" rows="3" placeholder="Empleado 1&#10;Empleado 2"></textarea></div>
    <div class="form-group"><label>Categorías de gastos (una por línea)</label><textarea id="cfg-categorias" rows="3" placeholder="Insumos&#10;Servicios&#10;Sueldos"></textarea></div>
    <button class="btn-cfg" id="btn-guardar-config">Guardar cambios</button>
    <button class="btn-volver" id="btn-cancelar-config">Volver a Liquidación</button>
  </div>
</div>

<header>
  <a href="#" onclick="location.href=sessionStorage.getItem('gestorbase_returnTo')||'app-basico.html';return false;" class="nav-btn">←</a>
  <span style="font-size:1.4rem">💼</span>
  <h1 id="header-title">Liquidación</h1>
  <button class="cfg-header-btn" id="btn-abrir-config">⚙️</button>
</header>

<div class="respaldo-banner" id="respaldo-banner" onclick="verRespaldo()">
  <span>💾 <span id="respaldo-count">Sin datos pendientes</span></span>
  <span style="font-weight:600">Ver / Sincronizar →</span>
</div>

<div class="contenido">
  <div class="mes-selector">
    <label>Mes</label>
    <select id="sel-mes"></select>
    <button class="btn-ver" id="btn-calcular">Calcular</button>
  </div>
  <div class="config-comision">
    <label>% de comisión por turno</label>
    <input type="number" id="inp-comision" min="0" max="100" value="50">
    <span style="font-size:1rem;font-weight:700;color:var(--muted)">%</span>
  </div>
  <div id="resultado">
    <div class="empty-state">💼<br><br>Seleccioná un mes y tocá <strong>Calcular</strong></div>
  </div>
</div>

<div class="modal-overlay" id="modal-respaldo">
  <div class="modal">
    <h2>💾 Respaldo local</h2>
    <p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">Turnos guardados localmente en este dispositivo.</p>
    <div id="respaldo-lista"></div>
    <button class="btn btn-gray" style="margin-top:16px" onclick="cerrarRespaldo()">Cerrar</button>
  </div>
</div>

<script>
history.pushState(null, '', window.location.href);
window.addEventListener('popstate', function() { history.back(); });

var CONFIG_KEY = 'gestorbase_config';
var CONFIG_DEFAULT = { negocio:'Mi Negocio', colorPrincipal:'#003b8e', colorAccent:'#0057d9', urlSheet:'', empleados:['Empleado 1','Empleado 2','Empleado 3'], categorias:['Insumos','Servicios','Sueldos','Alquiler','Mantenimiento','Otros'], porcentajeComision:50 };
var savedConfig = {};
try { savedConfig = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}'); } catch(e) {}
var CONFIG = {};
Object.keys(CONFIG_DEFAULT).forEach(function(k){ CONFIG[k] = savedConfig[k] !== undefined ? savedConfig[k] : CONFIG_DEFAULT[k]; });

var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function aplicarConfig() {
  document.documentElement.style.setProperty('--blue', CONFIG.colorPrincipal);
  document.documentElement.style.setProperty('--accent', CONFIG.colorAccent);
  document.getElementById('header-title').textContent = CONFIG.negocio + ' — Liquidación';
  document.title = CONFIG.negocio + ' — Liquidación';
  document.getElementById('inp-comision').value = CONFIG.porcentajeComision || 50;
  var sel = document.getElementById('sel-mes');
  sel.innerHTML = '';
  var hoy = new Date();
  for (var i = 0; i < 12; i++) {
    var d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    var val = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    var op = document.createElement('option');
    op.value = val; op.textContent = MESES[d.getMonth()] + ' ' + d.getFullYear();
    sel.appendChild(op);
  }
}

function abrirConfig() {
  document.getElementById('cfg-negocio').value = CONFIG.negocio;
  document.getElementById('cfg-url').value = CONFIG.urlSheet;
  document.getElementById('cfg-color1').value = CONFIG.colorPrincipal;
  document.getElementById('cfg-color2').value = CONFIG.colorAccent;
  document.getElementById('cfg-empleados').value = CONFIG.empleados.join('\n');
  document.getElementById('cfg-categorias').value = CONFIG.categorias.join('\n');
  document.getElementById('config-screen').className = 'visible';
}
document.getElementById('btn-abrir-config').addEventListener('click', abrirConfig);
document.getElementById('btn-cancelar-config').addEventListener('click', function(){ document.getElementById('config-screen').className = ''; });
document.getElementById('btn-guardar-config').addEventListener('click', function(){
  var negocio = document.getElementById('cfg-negocio').value.trim();
  var url = document.getElementById('cfg-url').value.trim();
  if (!negocio || !url) { alert('Completá el nombre del negocio y la URL de la planilla.'); return; }
  var empleados = document.getElementById('cfg-empleados').value.trim().split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var categorias = document.getElementById('cfg-categorias').value.trim().split('\n').map(function(l){return l.trim();}).filter(Boolean);
  if (!empleados.length) empleados = CONFIG_DEFAULT.empleados;
  if (!categorias.length) categorias = CONFIG_DEFAULT.categorias;
  var c = { negocio:negocio, urlSheet:url, colorPrincipal:document.getElementById('cfg-color1').value, colorAccent:document.getElementById('cfg-color2').value, empleados:empleados, categorias:categorias, porcentajeComision:parseInt(document.getElementById('inp-comision').value)||50 };
  try { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); } catch(e) {}
  location.reload();
});

if (!savedConfig.negocio) { abrirConfig(); }
aplicarConfig();

function getLocalTurnos() {
  var key = 'gestorbase_agenda_' + CONFIG.negocio.replace(/\s+/g,'_');
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e){ return []; }
}

function actualizarBanner() {
  var datos = getLocalTurnos();
  document.getElementById('respaldo-count').textContent = datos.length > 0 ? datos.length + ' turnos guardados localmente' : 'Sin datos pendientes';
}

function verRespaldo() {
  var datos = getLocalTurnos();
  var lista = document.getElementById('respaldo-lista');
  if (!datos.length) {
    lista.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px">No hay turnos guardados localmente.</p>';
  } else {
    lista.innerHTML = datos.map(function(t){
      return '<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:0.85rem"><strong>' + escHtml(t.cliente||'—') + '</strong> — ' + escHtml(t.fecha||'') + ' · ' + escHtml(t.servicio||'') + ' · $' + Number(t.monto||0).toLocaleString('es-AR') + '</div>';
    }).join('');
  }
  document.getElementById('modal-respaldo').classList.add('open');
}
function cerrarRespaldo() { document.getElementById('modal-respaldo').classList.remove('open'); }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('btn-calcular').addEventListener('click', calcular);

function calcular() {
  var mes = document.getElementById('sel-mes').value;
  var comision = parseFloat(document.getElementById('inp-comision').value) / 100;
  var partes = mes.split('-');
  var nombreMes = MESES[parseInt(partes[1])-1] + ' ' + partes[0];
  document.getElementById('resultado').innerHTML = '<div class="empty-state">⏳ Calculando...</div>';
  fetch(CONFIG.urlSheet + '?accion=liquidacion&mes=' + mes)
    .then(function(r){ return r.json(); })
    .then(function(data){ renderLiquidacion(data, comision, nombreMes); })
    .catch(function(){
      var todos = getLocalTurnos();
      var turnos = todos.filter(function(t){ return t.fecha && t.fecha.startsWith(mes); });
      var ingresos_por_empleado = {};
      CONFIG.empleados.forEach(function(e){ ingresos_por_empleado[e] = 0; });
      turnos.forEach(function(t){ if (ingresos_por_empleado[t.empleado] !== undefined) ingresos_por_empleado[t.empleado] += Number(t.monto||0); });
      renderLiquidacion({ turnos:turnos, ingresos_por_empleado:ingresos_por_empleado }, comision, nombreMes + ' (local)');
    });
}

function renderLiquidacion(data, comision, nombreMes) {
  var turnos = data.turnos || [];
  var ingresos_emp = data.ingresos_por_empleado || {};
  var porEmpleado = {};
  CONFIG.empleados.forEach(function(e){ porEmpleado[e] = []; });
  turnos.forEach(function(t){ if (porEmpleado[t.empleado] !== undefined) porEmpleado[t.empleado].push(t); });
  var totalLiquidar = 0;
  CONFIG.empleados.forEach(function(e){ totalLiquidar += Number(ingresos_emp[e]||0) * comision; });
  var html = '<div class="total-card"><div class="titulo">Total a liquidar — ' + nombreMes + '</div><div class="monto">$' + fmt(totalLiquidar) + '</div></div>';
  CONFIG.empleados.forEach(function(emp){
    var ts = porEmpleado[emp] || [];
    var ingEmp = Number(ingresos_emp[emp]||0);
    var liq = ingEmp * comision;
    var detalle = '';
    if (ts.length > 0) {
      ts.sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); });
      var filas = ts.map(function(tt){ return '<div class="detalle-row"><span>' + escHtml(tt.cliente||tt.nombre||'') + ' — ' + formatFecha(tt.fecha) + ' ' + (tt.hora||'') + '</span><span>' + escHtml(tt.servicio||'-') + '</span></div>'; }).join('');
      detalle = '<button class="detalle-toggle" onclick="toggleDetalle(this)">▸ Ver detalle de turnos</button><div class="detalle-lista">' + filas + '</div>';
    }
    html += '<div class="empleado-card"><div class="empleado-header"><div class="empleado-nombre"><div class="empleado-avatar">' + emp.charAt(0).toUpperCase() + '</div>' + escHtml(emp) + '</div><div class="badge-turnos">' + ts.length + ' turnos</div></div><div class="liq-grid"><div class="liq-stat"><div class="val">' + ts.length + '</div><div class="lab">Turnos</div></div><div class="liq-stat"><div class="val">$' + fmt(ingEmp) + '</div><div class="lab">Facturado</div></div><div class="liq-stat comision"><div class="val">$' + fmt(liq) + '</div><div class="lab">A cobrar (' + Math.round(comision*100) + '%)</div></div></div>' + detalle + '</div>';
  });
  document.getElementById('resultado').innerHTML = html;
}

function toggleDetalle(btn) {
  var lista = btn.nextElementSibling;
  lista.classList.toggle('open');
  btn.textContent = lista.classList.contains('open') ? '▾ Ocultar detalle' : '▸ Ver detalle de turnos';
}

function fmt(n) { return Number(n).toLocaleString('es-AR', { minimumFractionDigits:0, maximumFractionDigits:0 }); }
function formatFecha(f) { if (!f) return ''; var p=f.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

actualizarBanner();
</script>
</body>
</html>
