<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Liquidación</title>
<style>
:root {
  --blue: #003b8e;
  --accent: #0057d9;
  --gray: #f0f2f7;
  --white: #fff;
  --text: #1a1a2e;
  --muted: #6b7280;
  --border: #e2e6f0;
  --success: #16a34a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray); color: var(--text); min-height: 100vh; }
header { background: var(--blue); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
header h1 { font-size: 1.15rem; font-weight: 700; flex: 1; }
header span { font-size: 0.8rem; opacity: .75; }
.contenido { padding: 16px; max-width: 680px; margin: 0 auto; }
.mes-selector { background: #fff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 6px rgba(0,0,0,.07); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
.mes-selector label { font-size: 0.82rem; font-weight: 700; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
.mes-selector select { flex: 1; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; }
.mes-selector select:focus { outline: none; border-color: var(--accent); }
.btn-ver { padding: 9px 16px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 0.88rem; font-weight: 700; cursor: pointer; touch-action: manipulation; }
.config-card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.07); margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
.config-card label { font-size: 0.85rem; font-weight: 600; color: var(--muted); flex: 1; }
.config-card input { width: 80px; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 1rem; font-weight: 700; text-align: center; }
.config-card input:focus { outline: none; border-color: var(--accent); }
.config-card span { font-size: 1rem; font-weight: 700; color: var(--muted); }
.empleado-card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 6px rgba(0,0,0,.07); margin-bottom: 14px; }
.empleado-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.empleado-nombre { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.empleado-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; }
.badge-turnos { background: #dbeafe; color: var(--blue); border-radius: 99px; padding: 3px 10px; font-size: 0.78rem; font-weight: 700; }
.liq-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.liq-stat { text-align: center; }
.liq-stat .val { font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--blue); }
.liq-stat.comision .val { color: var(--success); }
.liq-stat .lab { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }
.detalle-toggle { width: 100%; padding: 8px; background: var(--gray); border: none; border-radius: 8px; font-size: 0.82rem; font-weight: 600; color: var(--muted); cursor: pointer; text-align: left; touch-action: manipulation; }
.detalle-lista { display: none; margin-top: 10px; }
.detalle-lista.open { display: block; }
.detalle-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.83rem; }
.detalle-row:last-child { border-bottom: none; }
.detalle-row .nombre { font-weight: 600; }
.detalle-row .monto { color: var(--success); font-variant-numeric: tabular-nums; }
.total-card { background: var(--blue); border-radius: 14px; padding: 20px; text-align: center; box-shadow: 0 2px 10px rgba(0,59,142,.2); margin-bottom: 16px; }
.total-card .titulo { font-size: 0.82rem; color: rgba(255,255,255,.7); margin-bottom: 6px; }
.total-card .monto { font-size: 1.9rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.9rem; }
.empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }
/* Config screen */
#config-screen { display: none; position: fixed; inset: 0; background: var(--gray); z-index: 200; overflow-y: auto; padding: 24px 16px; }
#config-screen.visible { display: block; }
#config-screen h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
#config-screen p { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
.cfg-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
.form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 7px; font-size: 0.95rem; font-family: inherit; color: var(--text); background: white; }
.form-group textarea { resize: vertical; min-height: 80px; }
.color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.color-row input[type="color"] { height: 44px; padding: 4px 6px; cursor: pointer; }
.btn-cfg { width: 100%; padding: 13px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; touch-action: manipulation; }
.config-logo { font-size: 2rem; text-align: center; margin-bottom: 8px; }
</style>
</head>
<body ontouchstart="">

<!-- Pantalla de configuración -->
<div id="config-screen">
  <div class="config-logo">💼</div>
  <h2>Configuración de Liquidación</h2>
  <p>Completá los datos de tu negocio. Podés editarlos cuando quieras desde el botón ⚙️.</p>
  <div class="cfg-card">
    <div class="form-group">
      <label>Nombre del negocio</label>
      <input type="text" id="cfg-negocio" placeholder="Ej: Peluquería Carla">
    </div>
    <div class="form-group">
      <label>URL de tu planilla Google</label>
      <input type="url" id="cfg-url" placeholder="https://script.google.com/...">
    </div>
    <div class="color-row">
      <div class="form-group">
        <label>Color principal</label>
        <input type="color" id="cfg-color1" value="#003b8e">
      </div>
      <div class="form-group">
        <label>Color acento</label>
        <input type="color" id="cfg-color2" value="#0057d9">
      </div>
    </div>
    <div class="form-group">
      <label>Empleados (uno por línea)</label>
      <textarea id="cfg-empleados" rows="4" placeholder="Empleado 1&#10;Empleado 2&#10;Empleado 3"></textarea>
    </div>
    <button class="btn-cfg" id="btn-guardar-config">Guardar y continuar</button>
  </div>
</div>

<header>
  <h1>💼 Liquidación</h1>
  <span id="header-negocio"></span>
  <button id="btn-abrir-config" style="background:none;border:none;color:white;font-size:1.3rem;cursor:pointer;padding:4px;touch-action:manipulation;">⚙️</button>
</header>

<div class="contenido">
  <div class="mes-selector">
    <label>Mes</label>
    <select id="sel-mes"></select>
    <button class="btn-ver" id="btn-calcular">Calcular</button>
  </div>
  <div class="config-card">
    <label>% de comisión por turno</label>
    <input type="number" id="inp-comision" min="0" max="100" value="50">
    <span>%</span>
  </div>
  <div id="resultado">
    <div class="empty-state">
      <div class="icon">💼</div>
      Seleccioná un mes y tocá <strong>Calcular</strong>
    </div>
  </div>
</div>

<script>
var CONFIG_KEY = 'gestorbase_config';
var CONFIG_DEFAULT = {
  negocio: 'Mi Negocio',
  colorPrincipal: '#003b8e',
  colorAccent: '#0057d9',
  urlSheet: '',
  empleados: ['Empleado 1', 'Empleado 2', 'Empleado 3'],
  porcentajeComision: 50
};
var savedConfig = {};
try { savedConfig = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}'); } catch(e) {}
var CONFIG = {};
var keys = Object.keys(CONFIG_DEFAULT);
for (var ki = 0; ki < keys.length; ki++) {
  CONFIG[keys[ki]] = savedConfig[keys[ki]] !== undefined ? savedConfig[keys[ki]] : CONFIG_DEFAULT[keys[ki]];
}

var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function aplicarConfig() {
  document.documentElement.style.setProperty('--blue', CONFIG.colorPrincipal);
  document.documentElement.style.setProperty('--accent', CONFIG.colorAccent);
  document.getElementById('page-title').textContent = 'Liquidación — ' + CONFIG.negocio;
  document.getElementById('header-negocio').textContent = CONFIG.negocio;
  document.getElementById('inp-comision').value = CONFIG.porcentajeComision || 50;
  var sel = document.getElementById('sel-mes');
  sel.innerHTML = '';
  var hoy = new Date();
  for (var i = 0; i < 12; i++) {
    var d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    var val = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    var op = document.createElement('option');
    op.value = val;
    op.textContent = MESES[d.getMonth()] + ' ' + d.getFullYear();
    sel.appendChild(op);
  }
}

function abrirConfig() {
  document.getElementById('cfg-negocio').value = CONFIG.negocio;
  document.getElementById('cfg-url').value = CONFIG.urlSheet;
  document.getElementById('cfg-color1').value = CONFIG.colorPrincipal;
  document.getElementById('cfg-color2').value = CONFIG.colorAccent;
  document.getElementById('cfg-empleados').value = CONFIG.empleados.join('\n');
  document.getElementById('config-screen').className = 'visible';
}

document.getElementById('btn-guardar-config').addEventListener('click', function() {
  var negocio = document.getElementById('cfg-negocio').value.trim();
  var url = document.getElementById('cfg-url').value.trim();
  if (!negocio || !url) {
    alert('Completá el nombre del negocio y la URL de la planilla.');
    return;
  }
  var empleadosRaw = document.getElementById('cfg-empleados').value.trim();
  var empleados = [];
  var lineas = empleadosRaw.split('\n');
  for (var i = 0; i < lineas.length; i++) {
    var l = lineas[i].trim();
    if (l) empleados.push(l);
  }
  if (!empleados.length) empleados = ['Empleado 1'];
  var nuevaConfig = {
    negocio: negocio,
    urlSheet: url,
    colorPrincipal: document.getElementById('cfg-color1').value,
    colorAccent: document.getElementById('cfg-color2').value,
    empleados: empleados,
    categorias: savedConfig.categorias || ['Insumos','Servicios','Sueldos','Alquiler','Mantenimiento','Otros'],
    porcentajeComision: parseInt(document.getElementById('inp-comision').value) || 50
  };
  try { localStorage.setItem(CONFIG_KEY, JSON.stringify(nuevaConfig)); } catch(e) {}
  location.reload();
});

document.getElementById('btn-abrir-config').addEventListener('click', function() {
  abrirConfig();
});

document.getElementById('btn-calcular').addEventListener('click', function() {
  calcular();
});

if (!savedConfig.negocio) {
  abrirConfig();
}

aplicarConfig();

function calcular() {
  var mes = document.getElementById('sel-mes').value;
  var comision = parseFloat(document.getElementById('inp-comision').value) / 100;
  var partes = mes.split('-');
  var anio = partes[0];
  var nmes = partes[1];
  var nombreMes = MESES[parseInt(nmes)-1] + ' ' + anio;
  document.getElementById('resultado').innerHTML = '<div class="empty-state">⏳ Calculando...</div>';
  fetch(CONFIG.urlSheet + '?accion=liquidacion&mes=' + mes)
    .then(function(r) { return r.json(); })
    .then(function(data) { renderLiquidacion(data, comision, nombreMes); })
    .catch(function() {
      var key = 'gestorbase_agenda_' + CONFIG.negocio;
      var todosLsTurnos = [];
      try { todosLsTurnos = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
      var turnos = [];
      for (var i = 0; i < todosLsTurnos.length; i++) {
        if (todosLsTurnos[i].fecha && todosLsTurnos[i].fecha.startsWith(mes)) turnos.push(todosLsTurnos[i]);
      }
      var data = { turnos: turnos, ingresos_por_empleado: {} };
      for (var ei = 0; ei < CONFIG.empleados.length; ei++) {
        data.ingresos_por_empleado[CONFIG.empleados[ei]] = 0;
      }
      renderLiquidacion(data, comision, nombreMes);
    });
}

function renderLiquidacion(data, comision, nombreMes) {
  var turnos = data.turnos || [];
  var ingresos_emp = data.ingresos_por_empleado || {};
  var porEmpleado = {};
  for (var ei = 0; ei < CONFIG.empleados.length; ei++) {
    porEmpleado[CONFIG.empleados[ei]] = [];
  }
  for (var ti = 0; ti < turnos.length; ti++) {
    var t = turnos[ti];
    if (porEmpleado[t.empleado] !== undefined) {
      porEmpleado[t.empleado].push(t);
    }
  }
  var totalLiquidar = 0;
  for (var ei2 = 0; ei2 < CONFIG.empleados.length; ei2++) {
    var ing = Number(ingresos_emp[CONFIG.empleados[ei2]] || 0);
    totalLiquidar += ing * comision;
  }
  var html = '<div class="total-card"><div class="titulo">Total a liquidar — ' + nombreMes + '</div><div class="monto">$' + fmt(totalLiquidar) + '</div></div>';
  for (var ei3 = 0; ei3 < CONFIG.empleados.length; ei3++) {
    var emp = CONFIG.empleados[ei3];
    var ts = porEmpleado[emp] || [];
    var ingEmp = Number(ingresos_emp[emp] || 0);
    var liq = ingEmp * comision;
    var inicial = emp.charAt(0).toUpperCase();
    var detalle = '';
    if (ts.length > 0) {
      ts.sort(function(a,b) { return a.fecha.localeCompare(b.fecha); });
      var filas = '';
      for (var di = 0; di < ts.length; di++) {
        var tt = ts[di];
        filas += '<div class="detalle-row"><span class="nombre">' + (tt.cliente || tt.nombre || '') + ' — ' + formatFecha(tt.fecha) + ' ' + (tt.hora||'') + '</span><span class="monto">' + (tt.servicio || '-') + '</span></div>';
      }
      detalle = '<button class="detalle-toggle" onclick="toggleDetalle(this)">▸ Ver detalle de turnos</button><div class="detalle-lista">' + filas + '</div>';
    }
    html += '<div class="empleado-card"><div class="empleado-header"><div class="empleado-nombre"><div class="empleado-avatar">' + inicial + '</div>' + emp + '</div><div class="badge-turnos">' + ts.length + ' turnos</div></div><div class="liq-grid"><div class="liq-stat"><div class="val">' + ts.length + '</div><div class="lab">Turnos</div></div><div class="liq-stat"><div class="val">$' + fmt(ingEmp) + '</div><div class="lab">Facturado</div></div><div class="liq-stat comision"><div class="val">$' + fmt(liq) + '</div><div class="lab">A cobrar (' + Math.round(comision*100) + '%)</div></div></div>' + detalle + '</div>';
  }
  document.getElementById('resultado').innerHTML = html;
}

function toggleDetalle(btn) {
  var lista = btn.nextElementSibling;
  lista.classList.toggle('open');
  btn.textContent = lista.classList.contains('open') ? '▾ Ocultar detalle' : '▸ Ver detalle de turnos';
}

function fmt(n) {
  return Number(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function formatFecha(f) {
  if (!f) return '';
  var p = f.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
</script>
</body>
</html>
