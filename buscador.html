<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Buscador</title>
<style>
:root {
  --blue: #003b8e;
  --accent: #0057d9;
  --gray: #f0f2f7;
  --white: #fff;
  --text: #1a1a2e;
  --muted: #6b7280;
  --border: #e2e6f0;
  --success: #16a34a;
  --danger: #e53e3e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray); color: var(--text); min-height: 100vh; }
header { background: var(--blue); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
header h1 { font-size: 1.15rem; font-weight: 700; flex: 1; }
header span { font-size: 0.8rem; opacity: .75; }
.contenido { padding: 16px; max-width: 680px; margin: 0 auto; }
.search-card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.07); margin-bottom: 16px; }
.search-wrap { display: flex; gap: 8px; margin-bottom: 12px; }
.search-wrap input { flex: 1; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 1rem; color: var(--text); }
.search-wrap input:focus { outline: none; border-color: var(--accent); }
.btn-buscar { padding: 11px 18px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; touch-action: manipulation; }
.filtros-busqueda { display: flex; gap: 8px; flex-wrap: wrap; }
.filtro-chip { padding: 5px 12px; border-radius: 99px; border: 1.5px solid var(--border); background: #fff; font-size: 0.8rem; font-weight: 600; color: var(--muted); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.filtro-chip.activo { background: var(--blue); border-color: var(--blue); color: #fff; }
.resultado-header { font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
.resultado-card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); border-left: 4px solid var(--accent); }
.resultado-card.tipo-gasto { border-left-color: var(--danger); }
.res-tipo { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.res-tipo.turno { color: var(--accent); }
.res-tipo.gasto { color: var(--danger); }
.res-nombre { font-weight: 700; font-size: 0.97rem; margin-bottom: 3px; }
.res-detalle { font-size: 0.82rem; color: var(--muted); }
.res-monto { font-size: 0.95rem; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.res-monto.ing { color: var(--success); }
.res-monto.gas { color: var(--danger); }
mark { background: #fef08a; border-radius: 2px; padding: 0 2px; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.9rem; }
.empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }
.cliente-card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 6px rgba(0,0,0,.07); margin-bottom: 14px; }
.cliente-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.cliente-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; flex-shrink: 0; }
.cliente-nombre { font-size: 1.05rem; font-weight: 700; }
.cliente-subtitulo { font-size: 0.8rem; color: var(--muted); }
.cliente-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.cli-stat { text-align: center; }
.cli-stat .val { font-size: 1.1rem; font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; }
.cli-stat .lab { font-size: 0.72rem; color: var(--muted); }
.ultimo-turno { font-size: 0.82rem; color: var(--muted); padding-top: 8px; border-top: 1px solid var(--border); }
/* Config screen */
#config-screen { display: none; position: fixed; inset: 0; background: var(--gray); z-index: 200; overflow-y: auto; padding: 24px 16px; }
#config-screen.visible { display: block; }
#config-screen h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
#config-screen p { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
.cfg-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
.form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 7px; font-size: 0.95rem; font-family: inherit; color: var(--text); background: white; }
.color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.color-row input[type="color"] { height: 44px; padding: 4px 6px; cursor: pointer; }
.btn-cfg { width: 100%; padding: 13px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; touch-action: manipulation; }
.config-logo { font-size: 2rem; text-align: center; margin-bottom: 8px; }
</style>
</head>
<body ontouchstart="">

<!-- Pantalla de configuración -->
<div id="config-screen">
  <div class="config-logo">🔍</div>
  <h2>Configuración de Buscador</h2>
  <p>Completá los datos de tu negocio. Podés editarlos cuando quieras desde el botón ⚙️.</p>
  <div class="cfg-card">
    <div class="form-group">
      <label>Nombre del negocio</label>
      <input type="text" id="cfg-negocio" placeholder="Ej: Peluquería Carla">
    </div>
    <div class="form-group">
      <label>URL de tu planilla Google</label>
      <input type="url" id="cfg-url" placeholder="https://script.google.com/...">
    </div>
    <div class="color-row">
      <div class="form-group">
        <label>Color principal</label>
        <input type="color" id="cfg-color1" value="#003b8e">
      </div>
      <div class="form-group">
        <label>Color acento</label>
        <input type="color" id="cfg-color2" value="#0057d9">
      </div>
    </div>
    <button class="btn-cfg" id="btn-guardar-config">Guardar y continuar</button>
  </div>
</div>

<header>
  <h1>🔍 Buscador</h1>
  <span id="header-negocio"></span>
  <button id="btn-abrir-config" style="background:none;border:none;color:white;font-size:1.3rem;cursor:pointer;padding:4px;touch-action:manipulation;">⚙️</button>
</header>

<div class="contenido">
  <div class="search-card">
    <div class="search-wrap">
      <input type="text" id="inp-buscar" placeholder="Buscar cliente, servicio, gasto...">
      <button class="btn-buscar" id="btn-buscar-action">Buscar</button>
    </div>
    <div class="filtros-busqueda">
      <button class="filtro-chip activo" id="chip-todo">Todo</button>
      <button class="filtro-chip" id="chip-clientes">👤 Clientes</button>
      <button class="filtro-chip" id="chip-turnos">📅 Turnos</button>
      <button class="filtro-chip" id="chip-gastos">💸 Gastos</button>
    </div>
  </div>
  <div id="resultados">
    <div class="empty-state">
      <div class="icon">🔍</div>
      Escribí un nombre o palabra clave para buscar
    </div>
  </div>
</div>

<script>
var CONFIG_KEY = 'gestorbase_config';
var CONFIG_DEFAULT = {
  negocio: 'Mi Negocio',
  colorPrincipal: '#003b8e',
  colorAccent: '#0057d9',
  urlSheet: ''
};
var savedConfig = {};
try { savedConfig = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}'); } catch(e) {}
var CONFIG = {};
var keys = Object.keys(CONFIG_DEFAULT);
for (var ki = 0; ki < keys.length; ki++) {
  CONFIG[keys[ki]] = savedConfig[keys[ki]] !== undefined ? savedConfig[keys[ki]] : CONFIG_DEFAULT[keys[ki]];
}

function aplicarConfig() {
  document.documentElement.style.setProperty('--blue', CONFIG.colorPrincipal);
  document.documentElement.style.setProperty('--accent', CONFIG.colorAccent);
  document.getElementById('page-title').textContent = 'Buscador — ' + CONFIG.negocio;
  document.getElementById('header-negocio').textContent = CONFIG.negocio;
}

function abrirConfig() {
  document.getElementById('cfg-negocio').value = CONFIG.negocio;
  document.getElementById('cfg-url').value = CONFIG.urlSheet;
  document.getElementById('cfg-color1').value = CONFIG.colorPrincipal;
  document.getElementById('cfg-color2').value = CONFIG.colorAccent;
  document.getElementById('config-screen').className = 'visible';
}

document.getElementById('btn-guardar-config').addEventListener('click', function() {
  var negocio = document.getElementById('cfg-negocio').value.trim();
  var url = document.getElementById('cfg-url').value.trim();
  if (!negocio || !url) {
    alert('Completá el nombre del negocio y la URL de la planilla.');
    return;
  }
  var nuevaConfig = {
    negocio: negocio,
    urlSheet: url,
    colorPrincipal: document.getElementById('cfg-color1').value,
    colorAccent: document.getElementById('cfg-color2').value,
    empleados: savedConfig.empleados || ['Empleado 1'],
    categorias: savedConfig.categorias || ['Insumos','Servicios','Sueldos','Alquiler','Mantenimiento','Otros'],
    porcentajeComision: savedConfig.porcentajeComision || 50
  };
  try { localStorage.setItem(CONFIG_KEY, JSON.stringify(nuevaConfig)); } catch(e) {}
  location.reload();
});

document.getElementById('btn-abrir-config').addEventListener('click', function() {
  abrirConfig();
});

if (!savedConfig.negocio) {
  abrirConfig();
}

aplicarConfig();

var filtroActivo = 'todo';
var todosDatos = { turnos: [], gastos: [] };

cargarDatos();

function cargarDatos() {
  fetch(CONFIG.urlSheet + '?accion=buscarTodo')
    .then(function(r) { return r.json(); })
    .then(function(data) { todosDatos = data; })
    .catch(function() {});
}

document.getElementById('btn-buscar-action').addEventListener('click', function() { buscar(); });
document.getElementById('inp-buscar').addEventListener('keydown', function(e) { if (e.key === 'Enter') buscar(); });
document.getElementById('chip-todo').addEventListener('click', function() { setFiltro('todo', this); });
document.getElementById('chip-clientes').addEventListener('click', function() { setFiltro('clientes', this); });
document.getElementById('chip-turnos').addEventListener('click', function() { setFiltro('turnos', this); });
document.getElementById('chip-gastos').addEventListener('click', function() { setFiltro('gastos', this); });

function setFiltro(filtro, btn) {
  filtroActivo = filtro;
  var chips = document.querySelectorAll('.filtro-chip');
  for (var i = 0; i < chips.length; i++) { chips[i].classList.remove('activo'); }
  btn.classList.add('activo');
  var q = document.getElementById('inp-buscar').value.trim();
  if (q) buscar();
}

function buscar() {
  var q = document.getElementById('inp-buscar').value.trim().toLowerCase();
  if (!q) return;
  var turnos = todosDatos.turnos || [];
  var gastos = todosDatos.gastos || [];
  var resultados = [];

  if (filtroActivo === 'todo' || filtroActivo === 'turnos' || filtroActivo === 'clientes') {
    var turnosFiltrados = [];
    for (var i = 0; i < turnos.length; i++) {
      var t = turnos[i];
      if ((t.cliente && t.cliente.toLowerCase().indexOf(q) >= 0) ||
          (t.servicio && t.servicio.toLowerCase().indexOf(q) >= 0) ||
          (t.empleado && t.empleado.toLowerCase().indexOf(q) >= 0) ||
          (t.notas && t.notas.toLowerCase().indexOf(q) >= 0)) {
        turnosFiltrados.push(t);
      }
    }
    if (filtroActivo === 'clientes') {
      var porCliente = {};
      for (var ci = 0; ci < turnosFiltrados.length; ci++) {
        var tc = turnosFiltrados[ci];
        var ckey = (tc.cliente || '').toLowerCase();
        if (!porCliente[ckey]) porCliente[ckey] = { cliente: tc.cliente, turnos: [], telefono: tc.telefono };
        porCliente[ckey].turnos.push(tc);
      }
      var ckeys = Object.keys(porCliente);
      for (var ck = 0; ck < ckeys.length; ck++) {
        var c = porCliente[ckeys[ck]];
        resultados.push({ tipo: 'cliente', cliente: c.cliente, turnos: c.turnos, telefono: c.telefono });
      }
    } else {
      for (var ti = 0; ti < turnosFiltrados.length; ti++) {
        var tf = turnosFiltrados[ti];
        resultados.push({ tipo: 'turno', cliente: tf.cliente, fecha: tf.fecha, hora: tf.hora, servicio: tf.servicio, monto: tf.monto });
      }
    }
  }

  if (filtroActivo === 'todo' || filtroActivo === 'gastos') {
    for (var gi = 0; gi < gastos.length; gi++) {
      var g = gastos[gi];
      if ((g.descripcion && g.descripcion.toLowerCase().indexOf(q) >= 0) ||
          (g.categoria && g.categoria.toLowerCase().indexOf(q) >= 0) ||
          (g.notas && g.notas.toLowerCase().indexOf(q) >= 0)) {
        resultados.push({ tipo: 'gasto', descripcion: g.descripcion, fecha: g.fecha, categoria: g.categoria, monto: g.monto });
      }
    }
  }

  renderResultados(resultados, q);
}

function renderResultados(resultados, q) {
  var contenedor = document.getElementById('resultados');
  if (!resultados.length) {
    contenedor.innerHTML = '<div class="empty-state"><div class="icon">😕</div>No se encontraron resultados para "<strong>' + q + '</strong>"</div>';
    return;
  }
  var html = '<div class="resultado-header">' + resultados.length + ' resultado(s)</div>';
  for (var i = 0; i < resultados.length; i++) {
    var r = resultados[i];
    if (r.tipo === 'cliente') {
      var ts = r.turnos;
      var totalMonto = 0;
      for (var ti = 0; ti < ts.length; ti++) { totalMonto += Number(ts[ti].monto || 0); }
      var ultimo = ts[ts.length - 1];
      html += '<div class="cliente-card"><div class="cliente-header"><div class="cliente-avatar">' + (r.cliente || '?').charAt(0).toUpperCase() + '</div><div><div class="cliente-nombre">' + resaltar(r.cliente, q) + '</div><div class="cliente-subtitulo">' + (r.telefono ? '📞 ' + r.telefono : 'Sin teléfono') + '</div></div></div><div class="cliente-stats"><div class="cli-stat"><div class="val">' + ts.length + '</div><div class="lab">Turnos</div></div><div class="cli-stat"><div class="val">$' + fmt(totalMonto) + '</div><div class="lab">Total</div></div><div class="cli-stat"><div class="val">' + (ultimo ? ultimo.fecha : '-') + '</div><div class="lab">Último</div></div></div>' + (ultimo ? '<div class="ultimo-turno">Último servicio: ' + (ultimo.servicio || '-') + '</div>' : '') + '</div>';
    } else if (r.tipo === 'turno') {
      html += '<div class="resultado-card tipo-turno"><div class="res-tipo turno">📅 Turno</div><div class="res-nombre">' + resaltar(r.cliente || '-', q) + '</div><div class="res-detalle">' + (r.fecha||'') + ' ' + (r.hora||'') + ' · ' + resaltar(r.servicio || '-', q) + '</div>' + (r.monto ? '<div class="res-monto ing">$' + fmt(r.monto) + '</div>' : '') + '</div>';
    } else if (r.tipo === 'gasto') {
      html += '<div class="resultado-card tipo-gasto"><div class="res-tipo gasto">💸 Gasto</div><div class="res-nombre">' + resaltar(r.descripcion || '-', q) + '</div><div class="res-detalle">' + (r.fecha||'') + ' · ' + resaltar(r.categoria || '-', q) + '</div><div class="res-monto gas">-$' + fmt(r.monto) + '</div></div>';
    }
  }
  contenedor.innerHTML = html;
}

function resaltar(texto, q) {
  if (!texto || !q) return texto || '';
  var regex = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return texto.replace(regex, '<mark>$1</mark>');
}

function fmt(n) {
  return Number(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
</script>
</body>
</html>
