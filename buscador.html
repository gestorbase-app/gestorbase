<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador</title>
<style>
:root { --blue:#003b8e; --accent:#0057d9; --gray:#f0f2f7; --text:#1a1a2e; --muted:#6b7280; --border:#e2e6f0; --danger:#e53e3e; --success:#16a34a; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,sans-serif; background:var(--gray); color:var(--text); min-height:100vh; }
header { background:var(--blue); color:white; padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
header h1 { flex:1; font-size:1.05rem; font-weight:600; }
.nav-btn { color:white; font-size:1.1rem; text-decoration:none; padding:6px 10px; background:rgba(255,255,255,0.2); border-radius:8px; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.cfg-header-btn { background:rgba(255,255,255,0.2); border:none; color:white; font-size:1.1rem; cursor:pointer; padding:6px 10px; border-radius:8px; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.respaldo-banner { display:flex; background:#fff8e1; border:1px solid #ffc107; border-radius:8px; padding:10px 14px; margin:12px 16px 0; font-size:0.85rem; color:#5d4037; cursor:pointer; touch-action:manipulation; align-items:center; justify-content:space-between; gap:8px; }
#config-screen { display:none; position:fixed; inset:0; background:var(--gray); z-index:200; overflow-y:auto; padding:24px 16px; }
#config-screen.visible { display:block; }
#config-screen h2 { font-size:1.1rem; font-weight:700; margin-bottom:4px; }
#config-screen .subtitulo { font-size:0.85rem; color:var(--muted); margin-bottom:20px; }
.cfg-card { background:white; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,0.07); margin-bottom:16px; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:0.75rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px; }
.form-group input, .form-group textarea { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:7px; font-size:0.95rem; font-family:inherit; color:var(--text); background:white; }
.form-group textarea { resize:vertical; min-height:70px; }
.color-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.color-row input[type="color"] { height:44px; padding:4px 6px; cursor:pointer; }
.btn-cfg { width:100%; padding:13px; background:var(--accent); color:white; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:8px; touch-action:manipulation; }
.btn-volver { width:100%; padding:13px; background:none; border:1.5px solid var(--border); border-radius:8px; font-size:1rem; color:var(--muted); cursor:pointer; margin-top:8px; touch-action:manipulation; }
.contenido { padding:16px; max-width:680px; margin:0 auto; }
.search-card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.07); margin-bottom:16px; }
.search-wrap { display:flex; gap:8px; margin-bottom:12px; }
.search-wrap input { flex:1; padding:11px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:1rem; color:var(--text); }
.search-wrap input:focus { outline:none; border-color:var(--accent); }
.btn-buscar-action { padding:11px 18px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-size:0.95rem; font-weight:700; cursor:pointer; touch-action:manipulation; }
.filtros-busqueda { display:flex; gap:8px; flex-wrap:wrap; }
.filtro-chip { padding:5px 12px; border-radius:99px; border:1.5px solid var(--border); background:#fff; font-size:0.8rem; font-weight:600; color:var(--muted); cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.filtro-chip.activo { background:var(--blue); border-color:var(--blue); color:#fff; }
.resultado-header { font-size:0.82rem; color:var(--muted); margin-bottom:10px; font-weight:600; }
.resultado-card { background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); border-left:4px solid var(--accent); }
.resultado-card.tipo-gasto { border-left-color:var(--danger); }
.res-tipo { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
.res-tipo.turno { color:var(--accent); }
.res-tipo.gasto { color:var(--danger); }
.res-nombre { font-weight:700; font-size:0.97rem; margin-bottom:3px; }
.res-detalle { font-size:0.82rem; color:var(--muted); }
.res-monto { font-size:0.95rem; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
.res-monto.ing { color:var(--success); }
.res-monto.gas { color:var(--danger); }
mark { background:#fef08a; border-radius:2px; padding:0 2px; }
.empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-size:0.9rem; }
.cliente-card { background:#fff; border-radius:14px; padding:18px; box-shadow:0 1px 6px rgba(0,0,0,.07); margin-bottom:14px; }
.cliente-header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.cliente-avatar { width:40px; height:40px; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; flex-shrink:0; }
.cliente-nombre { font-size:1.05rem; font-weight:700; }
.cliente-subtitulo { font-size:0.8rem; color:var(--muted); }
.cliente-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
.cli-stat { text-align:center; }
.cli-stat .val { font-size:1.1rem; font-weight:700; color:var(--blue); font-variant-numeric:tabular-nums; }
.cli-stat .lab { font-size:0.72rem; color:var(--muted); }
.ultimo-turno { font-size:0.82rem; color:var(--muted); padding-top:8px; border-top:1px solid var(--border); }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; align-items:flex-end; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal { background:white; border-radius:16px 16px 0 0; padding:24px 20px; width:100%; max-width:500px; max-height:80vh; overflow-y:auto; }
.modal h2 { font-size:1.05rem; font-weight:700; margin-bottom:8px; }
.btn { width:100%; padding:13px; background:var(--accent); color:white; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; touch-action:manipulation; margin-top:4px; }
.btn-gray { background:none; border:1.5px solid var(--border); color:var(--muted); }
</style>
</head>
<body ontouchstart="">

<div id="config-screen">
  <div style="font-size:2rem;text-align:center;margin-bottom:8px">⚙️</div>
  <h2>Configuración de GestorBase</h2>
  <p class="subtitulo">Estos datos se aplican a todos los módulos.</p>
  <div class="cfg-card">
    <div class="form-group"><label>Nombre del negocio</label><input type="text" id="cfg-negocio" placeholder="Ej: Peluquería Carla"></div>
    <div class="form-group"><label>URL de tu planilla Google</label><input type="url" id="cfg-url" placeholder="https://script.google.com/..."></div>
    <div class="color-row">
      <div class="form-group"><label>Color principal</label><input type="color" id="cfg-color1" value="#003b8e"></div>
      <div class="form-group"><label>Color acento</label><input type="color" id="cfg-color2" value="#0057d9"></div>
    </div>
    <div class="form-group"><label>Empleados (uno por línea)</label><textarea id="cfg-empleados" rows="3" placeholder="Empleado 1&#10;Empleado 2"></textarea></div>
    <div class="form-group"><label>Categorías de gastos (una por línea)</label><textarea id="cfg-categorias" rows="3" placeholder="Insumos&#10;Servicios&#10;Sueldos"></textarea></div>
    <button class="btn-cfg" id="btn-guardar-config">Guardar cambios</button>
    <button class="btn-volver" id="btn-cancelar-config">Volver a Buscador</button>
  </div>
</div>

<header>
  <a href="#" onclick="location.href=localStorage.getItem('gestorbase_returnTo')||(localStorage.getItem('gestorbase_activado_premium')?'app-premium.html':'app-basico.html');return false;" class="nav-btn">←</a>
  <span style="font-size:1.4rem">🔍</span>
  <h1 id="header-title">Buscador</h1>
  <button class="cfg-header-btn" id="btn-abrir-config">⚙️</button>
</header>

<div class="respaldo-banner" id="respaldo-banner" onclick="verRespaldo()">
  <span>💾 <span id="respaldo-count">Sin datos pendientes</span></span>
  <span style="font-weight:600">Ver datos locales →</span>
</div>

<div class="contenido">
  <div class="search-card">
    <div class="search-wrap">
      <input type="text" id="inp-buscar" placeholder="Buscar cliente, servicio, gasto...">
      <button class="btn-buscar-action" id="btn-buscar-action">Buscar</button>
    </div>
    <div class="filtros-busqueda">
      <button class="filtro-chip activo" id="chip-todo">Todo</button>
      <button class="filtro-chip" id="chip-clientes">👤 Clientes</button>
      <button class="filtro-chip" id="chip-turnos">📅 Turnos</button>
      <button class="filtro-chip" id="chip-gastos">💸 Gastos</button>
    </div>
  </div>
  <div id="resultados">
    <div class="empty-state">🔍<br><br>Escribí un nombre o palabra clave para buscar</div>
  </div>
</div>

<div class="modal-overlay" id="modal-respaldo">
  <div class="modal">
    <h2>💾 Datos locales</h2>
    <p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">Registros guardados en este dispositivo (usados como fallback de búsqueda).</p>
    <div id="respaldo-lista"></div>
    <button class="btn btn-gray" style="margin-top:16px" onclick="cerrarRespaldo()">Cerrar</button>
  </div>
</div>

<script>
history.pushState(null, '', window.location.href);
window.addEventListener('popstate', function() { history.back(); });

var CONFIG_KEY = 'gestorbase_config';
var CONFIG_DEFAULT = { negocio:'Mi Negocio', colorPrincipal:'#003b8e', colorAccent:'#0057d9', urlSheet:'', empleados:['Empleado 1','Empleado 2','Empleado 3'], categorias:['Insumos','Servicios','Sueldos','Alquiler','Mantenimiento','Otros'] };
var savedConfig = {};
try { savedConfig = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}'); } catch(e) {}
var CONFIG = {};
Object.keys(CONFIG_DEFAULT).forEach(function(k){ CONFIG[k] = savedConfig[k] !== undefined ? savedConfig[k] : CONFIG_DEFAULT[k]; });

function aplicarConfig() {
  document.documentElement.style.setProperty('--blue', CONFIG.colorPrincipal);
  document.documentElement.style.setProperty('--accent', CONFIG.colorAccent);
  document.getElementById('header-title').textContent = CONFIG.negocio + ' — Buscador';
  document.title = CONFIG.negocio + ' — Buscador';
}

function abrirConfig() {
  document.getElementById('cfg-negocio').value = CONFIG.negocio;
  document.getElementById('cfg-url').value = CONFIG.urlSheet;
  document.getElementById('cfg-color1').value = CONFIG.colorPrincipal;
  document.getElementById('cfg-color2').value = CONFIG.colorAccent;
  document.getElementById('cfg-empleados').value = CONFIG.empleados.join('\n');
  document.getElementById('cfg-categorias').value = CONFIG.categorias.join('\n');
  document.getElementById('config-screen').className = 'visible';
}
document.getElementById('btn-abrir-config').addEventListener('click', abrirConfig);
document.getElementById('btn-cancelar-config').addEventListener('click', function(){ document.getElementById('config-screen').className = ''; });
document.getElementById('btn-guardar-config').addEventListener('click', function(){
  var negocio = document.getElementById('cfg-negocio').value.trim();
  var url = document.getElementById('cfg-url').value.trim();
  if (!negocio || !url) { alert('Completá el nombre del negocio y la URL de la planilla.'); return; }
  var empleados = document.getElementById('cfg-empleados').value.trim().split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var categorias = document.getElementById('cfg-categorias').value.trim().split('\n').map(function(l){return l.trim();}).filter(Boolean);
  if (!empleados.length) empleados = CONFIG_DEFAULT.empleados;
  if (!categorias.length) categorias = CONFIG_DEFAULT.categorias;
  var c = { negocio:negocio, urlSheet:url, colorPrincipal:document.getElementById('cfg-color1').value, colorAccent:document.getElementById('cfg-color2').value, empleados:empleados, categorias:categorias };
  try { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); } catch(e) {}
  location.reload();
});

aplicarConfig();

var neg = CONFIG.negocio.replace(/\s+/g,'_');
function getLocalData() {
  var agenda = []; var gastos = [];
  try { agenda = JSON.parse(localStorage.getItem('gestorbase_agenda_' + CONFIG.negocio) || '[]'); } catch(e){}
  try { gastos = JSON.parse(localStorage.getItem('gestorbase_gastos_' + neg) || '[]'); } catch(e){}
  return { turnos: agenda, gastos: gastos };
}

function actualizarBanner() {
  var local = getLocalData();
  var total = local.turnos.length + local.gastos.length;
  document.getElementById('respaldo-count').textContent = total > 0 ? total + ' registros locales disponibles' : 'Sin datos pendientes';
}

function verRespaldo() {
  var local = getLocalData();
  var lista = document.getElementById('respaldo-lista');
  var total = local.turnos.length + local.gastos.length;
  if (!total) {
    lista.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px">No hay datos guardados localmente.</p>';
  } else {
    var html = '';
    if (local.turnos.length) html += '<p style="font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:6px">' + local.turnos.length + ' turnos</p>';
    if (local.gastos.length) html += '<p style="font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;margin-top:10px;margin-bottom:6px">' + local.gastos.length + ' gastos</p>';
    lista.innerHTML = html;
  }
  document.getElementById('modal-respaldo').classList.add('open');
}
function cerrarRespaldo() { document.getElementById('modal-respaldo').classList.remove('open'); }

var filtroActivo = 'todo';
var todosDatos = { turnos: [], gastos: [] };

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function esCobrado(v) { return !(v === false || v === 'FALSE' || v === 0 || v === '0'); }

function mapAgendaRow(row) {
  return {
    fecha: row.Fecha || '', hora: row.Hora || '', cliente: row.Cliente || '',
    empleado: row.Empleado || '', servicio: row.Servicio || '', monto: Number(row.Monto || 0),
    telefono: row.Telefono || '', notas: row.Notas || '', cobrado: esCobrado(row.Cobrado), id: String(row.ID || '')
  };
}
function mapGastosRow(row) {
  return {
    fecha: row.Fecha || '', responsable: row.Empleado || '', descripcion: row.Descripcion || '',
    categoria: row.Categoria || '', monto: Number(row.Monto || 0), notas: row.Notas || '', id: String(row.ID || '')
  };
}
function fetchTabla(tabla) {
  return fetch(CONFIG.urlSheet + '?tabla=' + encodeURIComponent(tabla))
    .then(function(r){ return r.json(); })
    .then(function(d){ if (!d.ok) throw new Error(d.error||'error'); return d.datos || []; });
}

cargarDatos();

function cargarDatos() {
  if (!CONFIG.urlSheet) { todosDatos = getLocalData(); return; }
  Promise.all([fetchTabla('Agenda'), fetchTabla('Gastos')])
    .then(function(res){ todosDatos = { turnos: res[0].map(mapAgendaRow), gastos: res[1].map(mapGastosRow) }; })
    .catch(function(){ todosDatos = getLocalData(); });
}

document.getElementById('btn-buscar-action').addEventListener('click', function(){ buscar(); });
document.getElementById('inp-buscar').addEventListener('keydown', function(e){ if (e.key==='Enter') buscar(); });
['chip-todo','chip-clientes','chip-turnos','chip-gastos'].forEach(function(id){
  document.getElementById(id).addEventListener('click', function(){
    filtroActivo = id.replace('chip-','');
    document.querySelectorAll('.filtro-chip').forEach(function(c){ c.classList.remove('activo'); });
    this.classList.add('activo');
    var q = document.getElementById('inp-buscar').value.trim();
    if (q) buscar();
  });
});

function buscar() {
  var q = document.getElementById('inp-buscar').value.trim().toLowerCase();
  if (!q) return;
  var turnos = todosDatos.turnos || [];
  var gastos = todosDatos.gastos || [];
  var resultados = [];
  if (filtroActivo === 'todo' || filtroActivo === 'turnos' || filtroActivo === 'clientes') {
    var tf = turnos.filter(function(t){
      return (t.cliente&&t.cliente.toLowerCase().indexOf(q)>=0)||(t.servicio&&t.servicio.toLowerCase().indexOf(q)>=0)||(t.empleado&&t.empleado.toLowerCase().indexOf(q)>=0);
    });
    if (filtroActivo === 'clientes') {
      var porCliente = {};
      tf.forEach(function(t){ var k=(t.cliente||'').toLowerCase(); if (!porCliente[k]) porCliente[k]={cliente:t.cliente,turnos:[],telefono:t.telefono}; porCliente[k].turnos.push(t); });
      Object.values(porCliente).forEach(function(c){ resultados.push({tipo:'cliente',cliente:c.cliente,turnos:c.turnos,telefono:c.telefono}); });
    } else {
      tf.forEach(function(t){ resultados.push({tipo:'turno',cliente:t.cliente,fecha:t.fecha,hora:t.hora,servicio:t.servicio,monto:t.monto,cobrado:t.cobrado}); });
    }
  }
  if (filtroActivo === 'todo' || filtroActivo === 'gastos') {
    gastos.filter(function(g){ return (g.descripcion&&g.descripcion.toLowerCase().indexOf(q)>=0)||(g.categoria&&g.categoria.toLowerCase().indexOf(q)>=0); })
      .forEach(function(g){ resultados.push({tipo:'gasto',descripcion:g.descripcion,fecha:g.fecha,categoria:g.categoria,monto:g.monto}); });
  }
  renderResultados(resultados, q);
}

function renderResultados(resultados, q) {
  var cont = document.getElementById('resultados');
  if (!resultados.length) { cont.innerHTML = '<div class="empty-state">😕<br><br>No se encontraron resultados para "<strong>' + escHtml(q) + '</strong>"</div>'; return; }
  var html = '<div class="resultado-header">' + resultados.length + ' resultado(s)</div>';
  resultados.forEach(function(r){
    if (r.tipo === 'cliente') {
      var ts = r.turnos; var total = ts.reduce(function(s,t){ return s+Number(t.monto||0); },0);
      var ult = ts[ts.length-1];
      html += '<div class="cliente-card"><div class="cliente-header"><div class="cliente-avatar">' + (r.cliente||'?').charAt(0).toUpperCase() + '</div><div><div class="cliente-nombre">' + resaltar(r.cliente,q) + '</div><div class="cliente-subtitulo">' + (r.telefono?'📞 '+r.telefono:'Sin teléfono') + '</div></div></div><div class="cliente-stats"><div class="cli-stat"><div class="val">' + ts.length + '</div><div class="lab">Turnos</div></div><div class="cli-stat"><div class="val">$' + fmt(total) + '</div><div class="lab">Total</div></div><div class="cli-stat"><div class="val">' + (ult?ult.fecha:'-') + '</div><div class="lab">Último</div></div></div>' + (ult?'<div class="ultimo-turno">Último servicio: '+escHtml(ult.servicio||'-')+'</div>':'') + '</div>';
    } else if (r.tipo === 'turno') {
      html += '<div class="resultado-card"><div class="res-tipo turno">📅 Turno</div><div class="res-nombre">' + resaltar(r.cliente||'-',q) + '</div><div class="res-detalle">' + escHtml(r.fecha||'') + ' ' + escHtml(r.hora||'') + ' · ' + resaltar(r.servicio||'-',q) + '</div>' + (r.monto?'<div class="res-monto ing">$'+fmt(r.monto)+' '+(esCobrado(r.cobrado)?'✅':'⏳')+'</div>':'') + '</div>';
    } else if (r.tipo === 'gasto') {
      html += '<div class="resultado-card tipo-gasto"><div class="res-tipo gasto">💸 Gasto</div><div class="res-nombre">' + resaltar(r.descripcion||'-',q) + '</div><div class="res-detalle">' + escHtml(r.fecha||'') + ' · ' + resaltar(r.categoria||'-',q) + '</div><div class="res-monto gas">-$' + fmt(r.monto) + '</div></div>';
    }
  });
  cont.innerHTML = html;
}

function resaltar(texto, q) {
  if (!texto||!q) return escHtml(texto||'');
  var regex = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return escHtml(texto).replace(regex,'<mark>$1</mark>');
}
function fmt(n) { return Number(n).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0}); }

actualizarBanner();
</script>
</body>
</html>
