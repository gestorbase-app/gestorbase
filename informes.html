<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informes</title>
<style>
  :root {
    --color: #0057d9;
    --bg: #f5f7fa;
    --card: #ffffff;
    --texto: #1a1a2e;
    --gris: #6b7280;
    --borde: #e5e7eb;
    --verde: #10b981;
    --rojo: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--texto); padding: 16px; }
  header { background: var(--color); color: white; padding: 14px 20px; display: flex; align-items: center; gap: 10px; margin: -16px -16px 16px -16px; }
  header h1 { font-size: 1.1rem; font-weight: 600; flex: 1; }
  h2 { font-size: 1.3rem; margin-bottom: 16px; color: var(--color); }
  h3 { font-size: 1rem; margin-bottom: 12px; color: var(--gris); text-transform: uppercase; letter-spacing: .05em; }
  .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .filtros select, .filtros input { padding: 8px 12px; border: 1px solid var(--borde); border-radius: 8px; font-size: .9rem; background: var(--card); }
  .filtros button { padding: 8px 16px; background: var(--color); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: .9rem; touch-action: manipulation; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card .label { font-size: .78rem; color: var(--gris); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .card .valor { font-size: 1.4rem; font-weight: 700; }
  .card.verde .valor { color: var(--verde); }
  .card.rojo .valor { color: var(--rojo); }
  .card.azul .valor { color: var(--color); }
  .seccion { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th { text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--borde); color: var(--gris); font-size: .78rem; text-transform: uppercase; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--borde); }
  tr:last-child td { border-bottom: none; }
  .loading { text-align: center; padding: 40px; color: var(--gris); }
  .error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  /* Config screen */
  #config-screen { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 200; overflow-y: auto; padding: 24px 16px; }
  #config-screen.visible { display: block; }
  #config-screen h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; color: var(--texto); }
  #config-screen p { font-size: 0.85rem; color: var(--gris); margin-bottom: 20px; }
  .cfg-card { background: var(--card); border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); margin-bottom: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--gris); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
  .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--borde); border-radius: 7px; font-size: 0.95rem; font-family: inherit; color: var(--texto); background: white; }
  .form-group textarea { resize: vertical; min-height: 70px; }
  .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .color-row input[type="color"] { height: 44px; padding: 4px 6px; cursor: pointer; }
  .btn-cfg { width: 100%; padding: 13px; background: var(--color); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; touch-action: manipulation; }
  .config-logo { font-size: 2rem; text-align: center; margin-bottom: 8px; }
</style>
</head>
<body ontouchstart="">

<!-- Pantalla de configuración -->
<div id="config-screen">
  <div class="config-logo">📊</div>
  <h2>Configuración de Informes</h2>
  <p>Completá los datos de tu negocio. Podés editarlos cuando quieras desde el botón ⚙️.</p>
  <div class="cfg-card">
    <div class="form-group">
      <label>Nombre del negocio</label>
      <input type="text" id="cfg-negocio" placeholder="Ej: Peluquería Carla">
    </div>
    <div class="form-group">
      <label>URL de tu planilla Google</label>
      <input type="url" id="cfg-url" placeholder="https://script.google.com/...">
    </div>
    <div class="color-row">
      <div class="form-group">
        <label>Color principal</label>
        <input type="color" id="cfg-color1" value="#003b8e">
      </div>
      <div class="form-group">
        <label>Color acento</label>
        <input type="color" id="cfg-color2" value="#0057d9">
      </div>
    </div>
    <button class="btn-cfg" id="btn-guardar-config">Guardar y continuar</button>
  </div>
</div>

<header>
  <span style="font-size:1.4rem">📊</span>
  <h1 id="header-title">Informes</h1>
  <button id="btn-abrir-config" style="background:none;border:none;color:white;font-size:1.3rem;cursor:pointer;padding:4px;touch-action:manipulation;">⚙️</button>
</header>

<div class="filtros">
  <select id="selMes"></select>
  <select id="selAnio"></select>
  <button id="btn-buscar">Buscar</button>
</div>

<div id="contenido"><p class="loading">Cargando...</p></div>

<script>
var CONFIG_KEY = 'gestorbase_config';
var CONFIG_DEFAULT = {
  negocio: 'Mi Negocio',
  colorPrincipal: '#003b8e',
  colorAccent: '#0057d9',
  urlSheet: ''
};
var savedConfig = {};
try { savedConfig = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}'); } catch(e) {}
var CONFIG = {};
var keys = Object.keys(CONFIG_DEFAULT);
for (var ki = 0; ki < keys.length; ki++) {
  CONFIG[keys[ki]] = savedConfig[keys[ki]] !== undefined ? savedConfig[keys[ki]] : CONFIG_DEFAULT[keys[ki]];
}

function aplicarConfig() {
  document.getElementById('header-title').textContent = CONFIG.negocio + ' — Informes';
  document.title = CONFIG.negocio + ' — Informes';
  document.documentElement.style.setProperty('--color', CONFIG.colorAccent);
}

function abrirConfig() {
  document.getElementById('cfg-negocio').value = CONFIG.negocio;
  document.getElementById('cfg-url').value = CONFIG.urlSheet;
  document.getElementById('cfg-color1').value = CONFIG.colorPrincipal;
  document.getElementById('cfg-color2').value = CONFIG.colorAccent;
  document.getElementById('config-screen').className = 'visible';
}

document.getElementById('btn-guardar-config').addEventListener('click', function() {
  var negocio = document.getElementById('cfg-negocio').value.trim();
  var url = document.getElementById('cfg-url').value.trim();
  if (!negocio || !url) {
    alert('Completá el nombre del negocio y la URL de la planilla.');
    return;
  }
  var nuevaConfig = {
    negocio: negocio,
    urlSheet: url,
    colorPrincipal: document.getElementById('cfg-color1').value,
    colorAccent: document.getElementById('cfg-color2').value,
    empleados: savedConfig.empleados || ['Empleado 1'],
    categorias: savedConfig.categorias || ['Insumos','Servicios','Sueldos','Alquiler','Mantenimiento','Otros']
  };
  try { localStorage.setItem(CONFIG_KEY, JSON.stringify(nuevaConfig)); } catch(e) {}
  location.reload();
});

document.getElementById('btn-abrir-config').addEventListener('click', function() {
  abrirConfig();
});

if (!savedConfig.negocio) {
  abrirConfig();
}

aplicarConfig();

var meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var selMes = document.getElementById('selMes');
var selAnio = document.getElementById('selAnio');
var hoy = new Date();

for (var i = 0; i < meses.length; i++) {
  var opt = document.createElement('option');
  opt.value = i + 1;
  opt.textContent = meses[i];
  if (i + 1 === hoy.getMonth() + 1) opt.selected = true;
  selMes.appendChild(opt);
}

for (var a = hoy.getFullYear(); a >= hoy.getFullYear() - 3; a--) {
  var optA = document.createElement('option');
  optA.value = a;
  optA.textContent = a;
  if (a === hoy.getFullYear()) optA.selected = true;
  selAnio.appendChild(optA);
}

document.getElementById('btn-buscar').addEventListener('click', function() {
  cargarInforme();
});

function fmt(n) {
  return '$' + Number(n || 0).toLocaleString('es-AR');
}

function cargarInforme() {
  var mes = selMes.value;
  var anio = selAnio.value;
  document.getElementById('contenido').innerHTML = '<p class="loading">Cargando...</p>';
  var url = CONFIG.urlSheet + '?accion=informes&mes=' + mes + '&anio=' + anio;
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) { renderInforme(data); })
    .catch(function(e) {
      document.getElementById('contenido').innerHTML = '<p class="error">Error al cargar: ' + e.message + '</p>';
    });
}

function renderInforme(data) {
  var cantTurnos = (data.turnos || []).length;
  var totalGastos = Number(data.gastos || 0);
  var totalIngresos = Number(data.ingresos || 0);
  var balance = Number(data.balance || 0);
  var listaGastos = data.gastosList || [];
  var listaTurnos = data.turnos || [];

  var html = '<div class="cards">' +
    '<div class="card verde"><div class="label">Ingresos</div><div class="valor">' + fmt(totalIngresos) + '</div></div>' +
    '<div class="card rojo"><div class="label">Gastos</div><div class="valor">' + fmt(totalGastos) + '</div></div>' +
    '<div class="card ' + (balance >= 0 ? 'verde' : 'rojo') + '"><div class="label">Balance</div><div class="valor">' + fmt(balance) + '</div></div>' +
    '<div class="card azul"><div class="label">Turnos</div><div class="valor">' + cantTurnos + '</div></div>' +
    '</div>';

  if (listaTurnos.length > 0) {
    html += '<div class="seccion"><h3>Turnos del período</h3><div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Cliente</th><th>Servicio</th><th>Monto</th></tr></thead><tbody>';
    for (var i = 0; i < listaTurnos.length; i++) {
      var t = listaTurnos[i];
      html += '<tr><td>' + (t.fecha||'') + '</td><td>' + (t.hora||'') + '</td><td>' + (t.cliente||'') + '</td><td>' + (t.servicio||'') + '</td><td>' + fmt(t.monto) + '</td></tr>';
    }
    html += '</tbody></table></div></div>';
  } else {
    html += '<div class="seccion"><p style="color:var(--gris);text-align:center;padding:20px">Sin turnos en este período</p></div>';
  }

  if (listaGastos.length > 0) {
    html += '<div class="seccion"><h3>Gastos del período</h3><div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Monto</th></tr></thead><tbody>';
    for (var j = 0; j < listaGastos.length; j++) {
      var g = listaGastos[j];
      html += '<tr><td>' + (g.fecha||'') + '</td><td>' + (g.descripcion||'') + '</td><td>' + (g.categoria||'') + '</td><td>' + fmt(g.monto) + '</td></tr>';
    }
    html += '</tbody></table></div></div>';
  } else {
    html += '<div class="seccion"><p style="color:var(--gris);text-align:center;padding:20px">Sin gastos en este período</p></div>';
  }

  document.getElementById('contenido').innerHTML = html;
}

cargarInforme();
</script>
</body>
</html>
